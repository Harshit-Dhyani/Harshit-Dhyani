name: Refresh profile build signals

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_public_builds.py"
      - ".github/workflows/update-profile-signals.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render latest public builds
        env:
          PROFILE_USERNAME: Harshit-Dhyani
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_public_builds.py

      - name: Commit changed signals
        shell: bash
        run: |
          if git diff --quiet -- assets/live-builds-dark.svg assets/live-builds-light.svg; then
            echo "No public build changes."
            exit 0
          fi
          git config user.name "harshbuilds-profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/live-builds-dark.svg assets/live-builds-light.svg
          git commit -m "chore: refresh public build signals [skip ci]"
          git push
