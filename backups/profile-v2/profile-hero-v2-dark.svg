<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">HarshBuilds proof pipeline</title>
  <desc id="desc">Harshit Dhyani builds AI products and local-first systems. An animated signal moves from task to build, test, human review, and verdict.</desc>
  <defs>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1280" height="400" fill="#090B0D"/>
  <path d="M42 42H114v4H46v68h-4z" fill="#FFB000"/>
  <path d="M1238 358h-72v-4h68v-68h4z" fill="#353B40"/>

  <text x="76" y="78" fill="#7E878F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.4">HARSHBUILDS // PROOF SYSTEM 02</text>
  <text x="76" y="166" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">Harshit Dhyani</text>
  <text x="79" y="209" fill="#B8C0C7" font-family="Arial, Helvetica, sans-serif" font-size="23">AI products · local-first tools · developer systems</text>

  <g transform="translate(78 255)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#687179" font-size="12" letter-spacing="1.8">PUBLIC LAB</text>
    <text x="0" y="32" fill="#F5F1E8" font-size="16" letter-spacing="1.05">REAL TASKS / VISIBLE PROOF / HONEST VERDICTS</text>
    <text x="0" y="68" fill="#8A939B" font-size="13">green tests != safe PR</text>
    <rect x="193" y="57" width="8" height="15" fill="#FFB000">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(680 68)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#687179" font-size="12" letter-spacing="2">EXECUTION TRACE</text>
    <text x="466" y="0" fill="#65D6A6" font-size="12" text-anchor="end">LIVE</text>
    <circle cx="482" cy="-4" r="4" fill="#65D6A6"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>

    <line x1="22" y1="92" x2="478" y2="92" stroke="#2B3237" stroke-width="2"/>
    <line x1="22" y1="92" x2="478" y2="92" stroke="#FFB000" stroke-width="2" stroke-dasharray="18 438" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-456" dur="4.8s" repeatCount="indefinite"/>
    </line>

    <circle cx="22" cy="92" r="7" fill="#090B0D" stroke="#FFB000" stroke-width="2"/>
    <circle cx="136" cy="92" r="7" fill="#090B0D" stroke="#FFB000" stroke-width="2"/>
    <circle cx="250" cy="92" r="7" fill="#090B0D" stroke="#65D6A6" stroke-width="2"/>
    <circle cx="364" cy="92" r="9" fill="#090B0D" stroke="#FFB000" stroke-width="2"/>
    <circle cx="478" cy="92" r="7" fill="#090B0D" stroke="#65D6A6" stroke-width="2"/>

    <circle cy="92" r="4" fill="#FFB000" filter="url(#soft)"><animate attributeName="cx" values="22;136;250;364;478" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cy="92" r="3" fill="#FFF1C4"><animate attributeName="cx" values="22;136;250;364;478" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle>

    <g font-size="11" letter-spacing="1.2" text-anchor="middle">
      <text x="22" y="126" fill="#8B949C">TASK</text>
      <text x="136" y="126" fill="#8B949C">BUILD</text>
      <text x="250" y="126" fill="#8B949C">TEST</text>
      <text x="364" y="126" fill="#F5F1E8">HUMAN REVIEW</text>
      <text x="478" y="126" fill="#8B949C">VERDICT</text>
    </g>

    <g transform="translate(0 170)" font-size="12">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#23292E"/>
      <text x="0" y="34" fill="#687179">01</text><text x="38" y="34" fill="#CDD3D8">make the smallest useful version</text>
      <text x="0" y="66" fill="#687179">02</text><text x="38" y="66" fill="#CDD3D8">surface failures instead of faking success</text>
      <text x="0" y="98" fill="#687179">03</text><text x="38" y="98" fill="#CDD3D8">treat generated output as unverified</text>
      <text x="0" y="130" fill="#687179">04</text><text x="38" y="130" fill="#CDD3D8">ship only after the evidence matches the claim</text>
    </g>
  </g>
</svg>
