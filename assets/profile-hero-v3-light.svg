<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">HarshBuilds entrepreneur and product builder profile</title>
  <desc id="desc">Harshit Dhyani is an entrepreneur and technical product builder. Animated product and proof loops show how ideas move through product, users, build, test, human review, and verdict.</desc>
  <defs>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1280" height="430" fill="#F5F1E8"/>
  <path d="M42 42H116v4H46v70h-4z" fill="#C87800"/>
  <path d="M1238 388h-74v-4h70v-70h4z" fill="#B9B3AA"/>

  <text x="76" y="70" fill="#747A80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.2">HARSHBUILDS // ENTREPRENEUR LAB // 2026</text>

  <text x="76" y="145" fill="#151719" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.4">Harshit Dhyani</text>
  <text x="78" y="190" fill="#C87800" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">ENTREPRENEUR · PRODUCT BUILDER</text>
  <text x="78" y="225" fill="#4E5459" font-family="Arial, Helvetica, sans-serif" font-size="18">Technical builder by leverage, not by identity.</text>

  <g transform="translate(78 272)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#777D82" font-size="11" letter-spacing="1.7">WHAT I BUILD AROUND</text>
    <text x="0" y="32" fill="#151719" font-size="15" letter-spacing="1.0">AI PRODUCTS / SAAS / AUTOMATION / SYSTEMS</text>
    <text x="0" y="67" fill="#666C71" font-size="12">idea -&gt; product -&gt; users -&gt; distribution -&gt; business</text>
    <rect x="397" y="56" width="8" height="15" fill="#C87800">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="628" y1="48" x2="628" y2="382" stroke="#D4CFC7"/>

  <g transform="translate(674 66)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#747A80" font-size="11" letter-spacing="2">HOW I WORK</text>
    <text x="482" y="0" text-anchor="end" fill="#228B61" font-size="11">LIVE</text>
    <circle cx="496" cy="-4" r="4" fill="#228B61"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>

    <text x="0" y="42" fill="#151719" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">PRODUCT LOOP</text>
    <line x1="12" y1="78" x2="488" y2="78" stroke="#CCC6BC" stroke-width="2"/>
    <circle cx="12" cy="78" r="6" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="131" cy="78" r="6" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="250" cy="78" r="6" fill="#F5F1E8" stroke="#228B61" stroke-width="2"/>
    <circle cx="369" cy="78" r="6" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="488" cy="78" r="6" fill="#F5F1E8" stroke="#228B61" stroke-width="2"/>
    <circle cy="78" r="4" fill="#C87800" filter="url(#soft)"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cy="78" r="3" fill="#7A4300"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="6s" repeatCount="indefinite"/></circle>
    <g font-size="10" letter-spacing="1" text-anchor="middle" fill="#6E7479">
      <text x="12" y="105">IDEA</text>
      <text x="131" y="105">PROBLEM</text>
      <text x="250" y="105">PRODUCT</text>
      <text x="369" y="105">USERS</text>
      <text x="488" y="105">BUSINESS</text>
    </g>

    <text x="0" y="159" fill="#151719" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">PROOF LOOP</text>
    <line x1="12" y1="195" x2="488" y2="195" stroke="#CCC6BC" stroke-width="2"/>
    <line x1="12" y1="195" x2="488" y2="195" stroke="#C87800" stroke-width="2" stroke-dasharray="20 456" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-476" dur="4.8s" repeatCount="indefinite"/></line>
    <circle cx="12" cy="195" r="6" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="131" cy="195" r="6" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="250" cy="195" r="6" fill="#F5F1E8" stroke="#228B61" stroke-width="2"/>
    <circle cx="369" cy="195" r="8" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="488" cy="195" r="6" fill="#F5F1E8" stroke="#228B61" stroke-width="2"/>
    <circle cy="195" r="4" fill="#C87800" filter="url(#soft)"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cy="195" r="3" fill="#7A4300"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle>
    <g font-size="10" letter-spacing="1" text-anchor="middle" fill="#6E7479">
      <text x="12" y="222">TASK</text>
      <text x="131" y="222">BUILD</text>
      <text x="250" y="222">TEST</text>
      <text x="369" y="222" fill="#151719">HUMAN REVIEW</text>
      <text x="488" y="222">VERDICT</text>
    </g>

    <line x1="0" y1="260" x2="506" y2="260" stroke="#D5D0C8"/>
    <text x="0" y="294" fill="#767C81" font-size="11">01</text><text x="34" y="294" fill="#34383B" font-size="12">build the smallest useful version</text>
    <text x="0" y="324" fill="#767C81" font-size="11">02</text><text x="34" y="324" fill="#34383B" font-size="12">learn what users actually value</text>
    <text x="0" y="354" fill="#767C81" font-size="11">03</text><text x="34" y="354" fill="#34383B" font-size="12">turn repeatable value into a business</text>
  </g>
</svg>
