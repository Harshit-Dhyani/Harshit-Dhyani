<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">HarshBuilds proof pipeline</title>
  <desc id="desc">Harshit Dhyani builds AI products and local-first systems. An animated signal moves from task to build, test, human review, and verdict.</desc>
  <defs>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1280" height="400" fill="#F5F1E8"/>
  <path d="M42 42H114v4H46v68h-4z" fill="#C87800"/>
  <path d="M1238 358h-72v-4h68v-68h4z" fill="#B9B3AA"/>

  <text x="76" y="78" fill="#71767B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.4">HARSHBUILDS // PROOF SYSTEM 02</text>
  <text x="76" y="166" fill="#151719" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">Harshit Dhyani</text>
  <text x="79" y="209" fill="#484D51" font-family="Arial, Helvetica, sans-serif" font-size="23">AI products · local-first tools · developer systems</text>

  <g transform="translate(78 255)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#777D82" font-size="12" letter-spacing="1.8">PUBLIC LAB</text>
    <text x="0" y="32" fill="#151719" font-size="16" letter-spacing="1.05">REAL TASKS / VISIBLE PROOF / HONEST VERDICTS</text>
    <text x="0" y="68" fill="#656B70" font-size="13">green tests != safe PR</text>
    <rect x="193" y="57" width="8" height="15" fill="#C87800">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(680 68)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#777D82" font-size="12" letter-spacing="2">EXECUTION TRACE</text>
    <text x="466" y="0" fill="#228B61" font-size="12" text-anchor="end">LIVE</text>
    <circle cx="482" cy="-4" r="4" fill="#228B61"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>

    <line x1="22" y1="92" x2="478" y2="92" stroke="#C8C2B8" stroke-width="2"/>
    <line x1="22" y1="92" x2="478" y2="92" stroke="#C87800" stroke-width="2" stroke-dasharray="18 438" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-456" dur="4.8s" repeatCount="indefinite"/>
    </line>

    <circle cx="22" cy="92" r="7" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="136" cy="92" r="7" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="250" cy="92" r="7" fill="#F5F1E8" stroke="#228B61" stroke-width="2"/>
    <circle cx="364" cy="92" r="9" fill="#F5F1E8" stroke="#C87800" stroke-width="2"/>
    <circle cx="478" cy="92" r="7" fill="#F5F1E8" stroke="#228B61" stroke-width="2"/>

    <circle cy="92" r="4" fill="#C87800" filter="url(#soft)"><animate attributeName="cx" values="22;136;250;364;478" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cy="92" r="3" fill="#7A4300"><animate attributeName="cx" values="22;136;250;364;478" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle>

    <g font-size="11" letter-spacing="1.2" text-anchor="middle">
      <text x="22" y="126" fill="#6D7378">TASK</text>
      <text x="136" y="126" fill="#6D7378">BUILD</text>
      <text x="250" y="126" fill="#6D7378">TEST</text>
      <text x="364" y="126" fill="#151719">HUMAN REVIEW</text>
      <text x="478" y="126" fill="#6D7378">VERDICT</text>
    </g>

    <g transform="translate(0 170)" font-size="12">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#D5D0C8"/>
      <text x="0" y="34" fill="#777D82">01</text><text x="38" y="34" fill="#34383B">make the smallest useful version</text>
      <text x="0" y="66" fill="#777D82">02</text><text x="38" y="66" fill="#34383B">surface failures instead of faking success</text>
      <text x="0" y="98" fill="#777D82">03</text><text x="38" y="98" fill="#34383B">treat generated output as unverified</text>
      <text x="0" y="130" fill="#777D82">04</text><text x="38" y="130" fill="#34383B">ship only after the evidence matches the claim</text>
    </g>
  </g>
</svg>
