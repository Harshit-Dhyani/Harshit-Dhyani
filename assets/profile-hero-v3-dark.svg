<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">HarshBuilds entrepreneur and product builder profile</title>
  <desc id="desc">Harshit Dhyani is an entrepreneur and technical product builder. Animated product and proof loops show how ideas move through product, users, build, test, human review, and verdict.</desc>
  <defs>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1280" height="430" fill="#090B0D"/>
  <path d="M42 42H116v4H46v70h-4z" fill="#FFB000"/>
  <path d="M1238 388h-74v-4h70v-70h4z" fill="#343A40"/>

  <text x="76" y="70" fill="#7F8890" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.2">HARSHBUILDS // ENTREPRENEUR LAB // 2026</text>

  <text x="76" y="145" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.4">Harshit Dhyani</text>
  <text x="78" y="190" fill="#FFB000" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">ENTREPRENEUR · PRODUCT BUILDER</text>
  <text x="78" y="225" fill="#B8C0C7" font-family="Arial, Helvetica, sans-serif" font-size="18">Engineering is leverage for building products.</text>

  <g transform="translate(78 272)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#6E777F" font-size="11" letter-spacing="1.7">WHAT I BUILD AROUND</text>
    <text x="0" y="32" fill="#F5F1E8" font-size="15" letter-spacing="1.0">AI PRODUCTS / SAAS / AUTOMATION / SYSTEMS</text>
    <text x="0" y="67" fill="#8D969E" font-size="12">idea -&gt; product -&gt; users -&gt; distribution -&gt; business</text>
    <rect x="397" y="56" width="8" height="15" fill="#FFB000"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <line x1="628" y1="48" x2="628" y2="382" stroke="#252B30"/>

  <g transform="translate(674 66)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#707981" font-size="11" letter-spacing="2">HOW I WORK</text>
    <text x="482" y="0" text-anchor="end" fill="#65D6A6" font-size="11">LIVE</text>
    <circle cx="496" cy="-4" r="4" fill="#65D6A6"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>

    <text x="0" y="42" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">PRODUCT LOOP</text>
    <line x1="12" y1="78" x2="488" y2="78" stroke="#2A3035" stroke-width="2"/>
    <circle cx="12" cy="78" r="6" fill="#090B0D" stroke="#FFB000" stroke-width="2"/><circle cx="131" cy="78" r="6" fill="#090B0D" stroke="#FFB000" stroke-width="2"/><circle cx="250" cy="78" r="6" fill="#090B0D" stroke="#65D6A6" stroke-width="2"/><circle cx="369" cy="78" r="6" fill="#090B0D" stroke="#FFB000" stroke-width="2"/><circle cx="488" cy="78" r="6" fill="#090B0D" stroke="#65D6A6" stroke-width="2"/>
    <circle cy="78" r="4" fill="#FFB000" filter="url(#soft)"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="6s" repeatCount="indefinite"/></circle><circle cy="78" r="3" fill="#FFF1C4"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="6s" repeatCount="indefinite"/></circle>
    <g font-size="10" letter-spacing="1" text-anchor="middle" fill="#8D969E"><text x="12" y="105">IDEA</text><text x="131" y="105">PROBLEM</text><text x="250" y="105">PRODUCT</text><text x="369" y="105">USERS</text><text x="488" y="105">BUSINESS</text></g>

    <text x="0" y="159" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">PROOF LOOP</text>
    <line x1="12" y1="195" x2="488" y2="195" stroke="#2A3035" stroke-width="2"/><line x1="12" y1="195" x2="488" y2="195" stroke="#FFB000" stroke-width="2" stroke-dasharray="20 456" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-476" dur="4.8s" repeatCount="indefinite"/></line>
    <circle cx="12" cy="195" r="6" fill="#090B0D" stroke="#FFB000" stroke-width="2"/><circle cx="131" cy="195" r="6" fill="#090B0D" stroke="#FFB000" stroke-width="2"/><circle cx="250" cy="195" r="6" fill="#090B0D" stroke="#65D6A6" stroke-width="2"/><circle cx="369" cy="195" r="8" fill="#090B0D" stroke="#FFB000" stroke-width="2"/><circle cx="488" cy="195" r="6" fill="#090B0D" stroke="#65D6A6" stroke-width="2"/>
    <circle cy="195" r="4" fill="#FFB000" filter="url(#soft)"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle><circle cy="195" r="3" fill="#FFF1C4"><animate attributeName="cx" values="12;131;250;369;488" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/></circle>
    <g font-size="10" letter-spacing="1" text-anchor="middle" fill="#8D969E"><text x="12" y="222">TASK</text><text x="131" y="222">BUILD</text><text x="250" y="222">TEST</text><text x="369" y="222" fill="#F5F1E8">HUMAN REVIEW</text><text x="488" y="222">VERDICT</text></g>

    <line x1="0" y1="260" x2="506" y2="260" stroke="#252B30"/>
    <text x="0" y="294" fill="#6F7880" font-size="11">01</text><text x="34" y="294" fill="#CCD2D7" font-size="12">build the smallest useful version</text><text x="0" y="324" fill="#6F7880" font-size="11">02</text><text x="34" y="324" fill="#CCD2D7" font-size="12">learn what users actually value</text><text x="0" y="354" fill="#6F7880" font-size="11">03</text><text x="34" y="354" fill="#CCD2D7" font-size="12">turn repeatable value into a business</text>
  </g>
</svg>
